# If your site is in 'https', then make sure your base url isn't written using 'http' otherwise your sitemap would
# contain http (as opposeed to https) URLs. This would affect Google indexing of your URLs.
# baseURL: "https://adityatelange.github.io/hugo-PaperMod/"
copyright: "© [Borys Palacz](https://github.com/boryspalacz)"
theme: PaperMod
enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts", "papermod"]
defaultContentLanguage: pl
disableKinds:
  - RSS

minify:
  disableXML: true
  # minifyOutput: true

pagination:
  disableAliases: false
  pagerSize: 5

languages:
  pl:
    languageName: "Polish"
    title: "Borilab - Finansowe Laboratorium"
    weight: 1
    taxonomies:
      category: categories
      tag: tagi
      series: series
    menu:
      main:
        - name: O mnie
          url: omnie/
          weight: 1
        - name: Blog
          url: blog/
          weight: 2
        - name: Szukaj
          url:  szukaj/
          weight: 4
        - name: Tagi
          url: tagi/
          weight: 3
#        - name: "Docs (Wiki)"
#         url: https://github.com/adityatelange/hugo-PaperMod/wiki/
    params:
      description: "Borilab – finansowe laboratorium."
      homeInfoParams:
        Content: |
          Cześć, jestem Borys i zapraszam Cię do mojego finansowego "laboratorium", więcej info znajdziesz w zakładce [o mnie](/omnie/).
          - Luźne i ambitne wpisy o rynku znajdziesz tutaj [blog](/blog/).
          - Jak chcesz poszukać na stronie czegoś konkretnego wpisz tutaj [szukaj](/szukaj/).
          - Chcesz się ze mną skontaktować? Śmiało, zapraszam poniżej. <br><br>

  en:
    languageName: "English"
    weight: 2
    title: "Borilab – Financial Laboratory"
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: About
          url: about/
          weight: 1
        - name: Blog
          url: blog/
          weight: 2
        - name: Search
          url:  search/
          weight: 4
        - name: Tags
          url: tags/
          weight: 3
#        - name: External
#          url: "https://github.com/adityatelange/hugo-PaperMod/wiki/Features#profile-mode"
    params:
      description: "Borilab – financial laboratory."
      homeInfoParams:
        Content: |
          Hi, I'm Borys and I invite you to my financial "laboratory." You can find more info in the [about](/about/) section.
          - Check out my casual and ambitious market insights on the [blog](/blog/).
          - If you're looking for something specific, use the [search](/search/).
          - Want to get in touch? Feel free to reach out below. <br><br>
          

outputFormats:
  llms:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - llms

# Wspólne parametry (takie same dla wszystkich języków)
params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  author: Borys Palacz
  # author: ["Me", "You"] # multiple authors
  defaultTheme: auto
  # disableThemeToggle: true
  ShowShareButtons: true
  ShowReadingTime: true
  # disableSpecial1stPost: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  # comments: false
  images: ["images/papermod-cover.png"]

  profileMode:
    enabled: false

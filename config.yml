# If your site is in 'https', then make sure your base url isn't written using 'http' otherwise your sitemap would
# contain http (as opposeed to https) URLs. This would affect Google indexing of your URLs.
baseURL: "https://borilab.pl/"
copyright: "© [Borys Palacz](https://github.com/boryspalacz)"
theme: PaperMod
enableInlineShortcodes: true
enableRobotsTXT: true
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts"]
defaultContentLanguage: pl
defaultContentLanguageInSubdir: false
disableKinds:
  - RSS
minify:
  disableXML: true
  # minifyOutput: true

pagination:
  disableAliases: false
  pagerSize: 5

languages:
  pl:
    languageName: "Polish"
    title: "Borilab | analizy rynkowe i śledzenie portfela"
    weight: 1
    taxonomies:
      category: categories
      tag: tagi
      series: series
    menu:
      main:
        - name: O mnie
          url: omnie/
          weight: 1
        - name: Blog
          url: posts/
          weight: 2
        - name: Szukaj
          url:  szukaj/
          weight: 4
        - name: Tagi
          url: tagi/
          weight: 3

    params:
      description: "Borilab | analizy rynkowe i śledzenie portfela"
      homeInfoParams:
        Content: |
          Track record inwestycyjny Borysa Palacza. Analizy rynkowe, alokacja kapitału i realne transakcje <br>
          na akcjach amerykańskich i europejskich. Licencja MPW nr 3967.
          - Luźne i ambitne wpisy o walce z rynkiem znajdziesz tutaj [blog](/posts/). 
          - Podsumowanie inwestycji, wynik oraz moją strategię znajdziesz tutaj [podsumowanie](/posts/podsumowanie/).
          - Chcesz się ze mną skontaktować? Śmiało, zapraszam poniżej. <br><br>

  en:
    languageName: "English"
    weight: 2
    title: "Borilab | Equity Research & Portfolio Tracking"
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: About
          url: about/
          weight: 1
        - name: Blog
          url: posts/
          weight: 2
        - name: Search
          url:  search/
          weight: 4
        - name: Tags
          url: tags/
          weight: 3

    params:
      description: "Borilab | Equity Research & Portfolio Tracking"
      homeInfoParams:
        Content: |
          Borys Palacz's investment track record. Market analysis, capital allocation, and real trades on US and European stocks. Polish stockbroker license no. 3967.
          - Check out my casual and ambitious market insights on the [posts](/posts/).
          - A summary of my investments is available here: [summary](/posts/summary/).
          - Want to get in touch? Feel free to reach out below. <br><br>
          

outputFormats:
  llms:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - llms

# Wspólne parametry (takie same dla wszystkich języków)
params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  author: Borys Palacz
  # author: ["Me", "You"] # multiple authors
  defaultTheme: auto
  # disableThemeToggle: true
  ShowShareButtons: false
  ShowReadingTime: true
  # disableSpecial1stPost: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  # comments: false
  images: ["images/papermod-cover.png"]

  profileMode:
    enabled: false

  socialIcons:
    - name: email
      title: Send me an email
      url: "mailto:info@borilab.pl"
    - name: linkedin
      title: Follow me on LinkedIn
      url: "https://www.linkedin.com/in/borys-palacz/"
    - name: X
      title: Follow me on X
      url: "https://x.com/borilab"
    - name: tradingview
      title: Follow me on TradingView
      url: "https://www.tradingview.com/u/borilab/"


  label:
    text: "Borilab"
